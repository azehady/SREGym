id: dns_resolver_hardware_failure
mechanism: Node-local resolver path fails, so service-name lookups break for every pod on the node
category: Hardware Component Failure
fault_level: Hardware
primitive: getaddrinfo_fail
engine: sregym
fidelity: node-level
symptom_class: startup-or-dependency-failure
requires:
  kind: deployment
params:
  difficulty: hard
  observable: Pods on one node fail in ways nothing in their own spec explains
checks:
  # Proof lives with the injector, not the victim: the probe is a BPF pin in the node kernel.
  applied:
    namespace: khaos
    exec: daemonset/khaos
    command: sh -lc 'ls /sys/fs/bpf 2>/dev/null | grep getaddrinfo_fail | head -1'
    contains: "getaddrinfo_fail"
    retries: 6
    delay: 5
  symptom:
    logs: deployment/{name}
    matches: "no such host|name resolution|temporary failure in name resolution|lookup .* failed"
    retries: 12
    delay: 10
root_cause_template: >-
  Node-local resolver path fails, so service-name lookups break for every pod on the node. {workload} is a victim of the node it happens to be scheduled on; its own spec is
  correct, and rescheduling it elsewhere is what makes the symptom move.
public_instances: []
