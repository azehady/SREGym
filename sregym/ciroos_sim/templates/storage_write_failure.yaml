id: storage_write_failure
mechanism: Disk rejects writes, so nothing the workload tries to persist reaches storage
category: Hardware Component Failure
fault_level: Hardware
primitive: write_error
engine: sregym
fidelity: node-level
symptom_class: startup-or-dependency-failure
requires:
  kind: deployment
params:
  difficulty: hard
  observable: Pods on one node fail in ways nothing in their own spec explains
checks:
  # Proof lives with the injector, not the victim: the probe is a BPF pin in the node kernel.
  applied:
    namespace: khaos
    exec: daemonset/khaos
    command: sh -lc 'ls /sys/fs/bpf 2>/dev/null | grep write_error | head -1'
    contains: "write_error"
    retries: 6
    delay: 5
  symptom:
    logs: deployment/{name}
    matches: "no space left|input/output error|write error|failed to write"
    retries: 12
    delay: 10
root_cause_template: >-
  Disk rejects writes, so nothing the workload tries to persist reaches storage. {workload} is a victim of the node it happens to be scheduled on; its own spec is
  correct, and rescheduling it elsewhere is what makes the symptom move.
public_instances: []
