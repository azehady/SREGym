---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-out
  labels:
    app-name: jaeger
  namespace: observe
spec:
  type: NodePort
  ports:
  - port: 16686
  selector:
    app-name: jaeger
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  labels:
    app-name: jaeger
  namespace: observe
spec:
  ports:
  - port: 5775
    name: udp1
    protocol: UDP
  - port: 5778
    name: tcp1
  - port: 6831
    name: udp2
    protocol: UDP
  - port: 6832
    name: udp3
    protocol: UDP
  - port: 14250
    name: tcp2
  - port: 14268
    name: tcp3
  - port: 4317
    name: otlp-grpc
  - port: 4318
    name: otlp-http
  selector:
    app-name: jaeger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-agent
  labels:
    app-name: jaeger
  namespace: observe
spec:
  replicas: 1
  selector:
    matchLabels:
      app-name: jaeger
  template:
    metadata:
      labels:
        app-name: jaeger
      name: jaeger-agent
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
      - name: jaeger-agent
        image: jaegertracing/all-in-one:1.57
        args:
        - "--collector.otlp.enabled=true"
        # all-in-one defaults to in-memory storage with no cap, so the span
        # store grows for as long as the process lives. This is the central
        # Jaeger for every app namespace; 25000 matches the bound the
        # astronomy-shop chart already applies to its own Jaeger.
        - "--memory.max-traces=25000"
        # NO resources block, deliberately — matching the benchmark.
        #
        # There used to be `limits: memory: 1Gi` here. Upstream SREGym sets no resource limits on
        # this Deployment at all, and its own astronomy-shop chart runs all-in-one with
        # `--memory.max-traces=5000` and no limit either. So a cap on the span store is
        # benchmark-idiomatic; a memory *limit* appears nowhere in SREGym and was purely ours.
        #
        # That limit was also actively harmful. all-in-one keeps spans IN MEMORY, 25000
        # astronomy-shop traces cost ~1.1Gi, so 1Gi sat just under the cap and the OOM killer
        # enforced it instead: OOMKilled twice on 2026-10-11/12 (exit 137), each time wiping every
        # span AND the whole service catalogue. The failure is SILENT — icecream still returns
        # HTTP 200 and the trace query answers "No services found in Jaeger", which an RCA reads as
        # "no trace evidence exists" rather than as infra.
        #
        # Under an active sweep it OOMed in ~5h, not the ~17h that idle uptime suggested — trace
        # volume tracks loadgen traffic, so do not size this from an idle observation.
        #
        # max-traces stays as the real bound (~1.1Gi, far under the control-plane node's headroom),
        # which is stricter than upstream's unbounded default while removing the OOM entirely.
        # Do NOT patch this at runtime with `kubectl set resources`: the conductor re-applies this
        # manifest on every env setup and silently reverts it.
        ports:
        - containerPort: 5775
          protocol: UDP
        - containerPort: 6831
          protocol: UDP
        - containerPort: 6832
          protocol: UDP
        - containerPort: 5778
          protocol: TCP
        - containerPort: 16686
          protocol: TCP
        - containerPort: 14268
          protocol: TCP
        - containerPort: 14250
          protocol: TCP
        - containerPort: 4317
          protocol: TCP
        - containerPort: 4318
          protocol: TCP
        env:
        - name: COLLECTOR_ZIPKIN_HTTP_PORT
          value: "9411"
      restartPolicy: Always
